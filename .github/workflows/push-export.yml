name: Publish Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  GODOT_VERSION: 4.7.2
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.local/share/godot/export_templates
            ~/godot-bin
          key: godot-web-${{ runner.os }}-${{ env.GODOT_VERSION }}-v1
      - name: Install official Godot and Web templates
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          engine="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$base/$engine" -o "$engine"
          curl --fail --location --retry 3 "$base/$templates" -o "$templates"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $engine" SHA512-SUMS.txt | sha512sum --check --strict
          grep -F " $templates" SHA512-SUMS.txt | sha512sum --check --strict
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -j "$engine" -d ~/godot-bin
          unzip -j "$templates" 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          chmod +x ~/godot-bin/Godot*
      - name: Import and export
        shell: bash
        run: |
          set -euo pipefail
          godot="$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --editor --path . --import
          mkdir -p builds/web
          "$godot" --headless --path . --export-release Web builds/web/index.html
          test -s builds/web/index.html
          test -s builds/web/index.wasm
          test -s builds/web/index.pck
          touch builds/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
