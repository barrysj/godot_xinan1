,218 345,231 326,225 309,210 303,188 304,172 318,160" fill="#5374B7" fill-opacity=".16" stroke="#5374B7" stroke-width="1.8" stroke-linejoin="round"/><g class="numbers"><circle cx="347" cy="180" r="10" fill="white" stroke="#5374B7" stroke-width="1.5"/><text x="347" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5374B7" font-weight="bold">2</text></g></g><g id="structure-pinxue_a"><title>品学楼 A 区: 分别保留 A/B/C 区，避免合并成虚构大楼；内部庭院待细分。</title><polygon points="574,88 615,83 626,105 630,113 633,132 596,139 580,130 574,115" fill="#8A65AE" fill-opacity=".16" stroke="#8A65AE" stroke-width="1.8" stroke-linejoin="round"/><g class="numbers"><circle cx="603" cy="111" r="10" fill="white" stroke="#8A65AE" stroke-width="1.5"/><text x="603" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A65AE" font-weight="bold">3</text></g></g><g id="structure-pinxue_b"><title>品学楼 B 区: 邻近标注遮挡，不根据标注图钉定义建筑中心。</title><polygon points="582,143 634,138 643,171 591,184 582,163" fill="#8A65AE" fill-opacity=".16" stroke="#8A65AE" stroke-width="1.8" stroke-linejoin="round"/><g class="numbers"><circle cx="612" cy="160" r="10" fill="white" stroke="#8A65AE" stroke-width="1.5"/><text x="612" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A65AE" font-weight="bold">4</text></g></g><g id="structure-pinxue_c"><title>品学楼 C 区: 可见外轮廓；内部庭院待细分。</title><polygon points="642,106 696,104 709,122 701,151 646,156" fill="#8A65AE" fill-opacity=".16" stroke="#8A65AE" stroke-width="1.8" stroke-linejoin="round"/><g class="numbers"><circle cx="675" cy="128" r="10" fill="white" stroke="#8A65AE" stroke-width="1.5"/><text x="675" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A65AE" font-weight="bold">5</text></g></g><g id="structure-liren"><title>立人楼组团: 北侧被立人楼停车场／前道路标签遮挡，虚线段为待核对连接；不可当作已确认精确边界。</title><polygon points="530,238 549,225 570,213 605,215 638,229 654,238 661,254 662,281 649,295 610,300 569,283 535,266 520,254" fill="#B05773" fill-opacity=".16" stroke="#B05773" stroke-width="1.8" stroke-linejoin="round"/><polyline points="530,238 549,225 570,213 605,215" fill="none" stroke="#fff" stroke-width="3.2"/><polyline points="530,238 549,225 570,213 605,215" fill="none" stroke="#B05773" stroke-width="2" stroke-dasharray="3 3"/><g class="numbers"><circle cx="605" cy="262" r="10" fill="white" stroke="#B05773" stroke-width="1.5"/><text x="605" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B05773" font-weight="bold">6</text></g></g><g id="structure-plaza"><title>时间广场（用户称时光广场）: 按粉色铺装可见外缘估计投影椭圆；北侧被图钉遮挡，中心及半径待用户核对。</title><ellipse cx="421" cy="235" rx="28" ry="19" fill="#C68335" fill-opacity=".16" stroke="#C68335" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="3 2"/><g class="numbers"><circle cx="421" cy="235" r="10" fill="white" stroke="#C68335" stroke-width="1.5"/><text x="421" y="239" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C68335" font-weight="bold">8</text></g></g><g id="structure-ginkgo"><title>银杏大道中心线: 南端原图坐标 (885,775) 保持不变；北端由用户指定为 (1094.6,578.5)。宽度仍为图上估计。北端弯接段不强行拉直，不在本条线中。</title><polyline points="325,405 534.6,208.5" fill="none" fill-opacity=".16" stroke="#187D67" stroke-width="6" stroke-linejoin="round"/><g class="numbers"><circle cx="435" cy="323" r="10" fill="white" stroke="#187D67" stroke-width="1.5"/><text x="435" y="327" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#187D67" font-weight="bold">9</text></g></g><g id="structure-plaza_link"><title>图书馆—广场前侧横向道路: 图书馆南侧至银杏大道交点；原图其他园路本轮不描。</title><polyline points="303,217 444,293" fill="none" fill-opacity=".16" stroke="#71869A" stroke-width="3" stroke-linejoin="round"/></g></g></svg>