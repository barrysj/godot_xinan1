<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>派遣地图编辑器</title><link rel="stylesheet" href="/editor.css"><style>
textarea{width:100%;min-height:105px;font:inherit;color:inherit;background:#102231;border:1px solid #668495;border-radius:5px;padding:8px}a{color:#a1e1e9}.inspector{overflow:auto;padding:16px}label{display:block;margin:10px 0}input,select{width:100%}input[type=checkbox]{width:auto}.group{border-top:1px solid #426174;padding-top:14px;margin-top:18px}#stage img{object-fit:fill}.help{line-height:1.6}#message{white-space:normal}.top-actions{flex-wrap:wrap}h2{font-size:17px;margin:5px 0 12px}
</style></head><body>
<header class="topbar"><div class="identity"><div><strong>派遣地图编辑器</strong><small><a href="/">校园地图</a> · 地点与委托共用游戏数据</small></div></div><div class="top-actions"><span id="dirty">已同步</span><button id="undo">撤销</button><button id="redo">重做</button><button id="import">导入</button><button id="export">导出</button><button id="save" class="primary">保存派遣</button><input type="file" id="file" accept="application/json" hidden></div></header>
<main class="shell"><section class="workbench"><div class="map-toolbar"><div class="mode-group"><button id="campus">校内</button><button id="city">校外</button></div><div class="zoom-group"><button id="minus">缩小</button><span id="zoom-value"></span><button id="plus">放大</button><button id="fit">适应</button></div></div><div class="viewport" id="viewport"><div class="stage" id="stage"><img id="map-image" alt="派遣地形底图"><canvas id="overlay" aria-label="拖动地点标记调整位置"></canvas></div></div><div class="canvas-footer"><span id="message" role="status">正在加载…</span></div></section>
<aside class="inspector"><h2>地点</h2><select id="place-select" aria-label="选择地点"></select><label>名称<input id="place-name" maxlength="32"></label><div class="two-cols"><label>X（0～1）<input id="place-x" type="number" min="0" max="1" step="0.001"></label><label>Y（0～1）<input id="place-y" type="number" min="0" max="1" step="0.001"></label></div><p class="help">拖动地图标记调整位置。地形底图独立于地点，滚轮可缩放。</p><button id="delete-place">删除地点</button><details class="group"><summary>新增地点</summary><label>唯一 ID<input id="new-place-id" placeholder="chengdu_museum"></label><label>显示名称<input id="new-place-name" maxlength="32"></label><button id="add-place">添加地点</button></details>
<section class="group"><h2>地点委托</h2><select id="task-select" aria-label="选择委托"></select><div id="task-fields"><label>名称<input id="task-name" maxlength="32"></label><label>说明<textarea id="task-description" maxlength="1200"></textarea></label><label>修复资源<input id="task-cost" type="number" min="0" max="999" step="1"></label><label>所属地点<select id="task-location"></select></label><label>前置委托<select id="task-requires"></select></label><label><input id="task-enabled" type="checkbox">启用</label><p id="task-effect" class="help"></p></div><p class="help">已登记委托保留 ID 和奖励身份，停用后不再出售，已有存档仍可识别。新增机制需先实现游戏效果。</p></section>
<details class="group"><summary>新增委托</summary><label>唯一 ID<input id="new-task-id" placeholder="museum_contact"></label><label>名称<input id="new-task-name" maxlength="32"></label><label>奖励类型<select id="new-task-kind"></select></label><label>奖励内容<select id="new-task-value"></select></label><button id="add-task">添加委托</button></details></aside></main><script type="module" src="/dispatch-editor.mjs"></script></body></html>
