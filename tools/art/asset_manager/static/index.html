<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美术资源台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <script id="boot-data" type="application/json">__ART_MANAGER_BOOT__</script>
  <main class="shell">
    <header class="hero">
      <div>
        <h1>美术资源台</h1>
        <p class="subtitle">校园素材、角色动作与当前版本</p>
      </div>
      <div class="desk-actions">
        <button id="refresh" class="primary" type="button">刷新</button>
        <details class="tools-menu" id="tools-menu">
          <summary>工具</summary>
          <section class="scan-panel" aria-labelledby="scan-title">
            <h2 id="scan-title">目录与校验</h2>
            <p class="tool-help">日常浏览只读取目录；交付前可完整核对文件与引用。</p>
            <div class="scan-grid">
              <label class="field manifest-field">
                <span>Manifest 路径</span>
                <span class="path-picker">
                  <input id="manifest" type="text" spellcheck="false">
                  <button id="pick-manifest" class="secondary" type="button">选择</button>
                </span>
              </label>
              <label class="field engine-field">
                <span>Godot 路径</span>
                <input id="engine" type="text" spellcheck="false" placeholder="预览时使用">
              </label>
              <div class="scan-actions">
                <button id="scan" class="secondary">完整校验</button>
                <button id="defaults" class="secondary">恢复</button>
              </div>
            </div>
          </section>
        </details>
      </div>
    </header>

    <section class="library" aria-labelledby="library-title">
      <div class="section-heading library-heading">
        <div class="library-title"><h2 id="library-title">素材库</h2><span id="summary" class="summary">正在读取目录</span></div>
        <label class="search-field"><span>搜索</span><input id="search" type="search" placeholder="素材名称、类别或编号" autocomplete="off"></label>
      </div>
      <div class="library-filters">
        <nav id="filters" class="filters" aria-label="资源分类"></nav>
        <label class="generated-filter" title="已有可用的资产阶段文件；批准与接入状态另行显示">
          <input id="generated-only" type="checkbox">
          <span>已生成资产</span>
          <span id="generated-count" class="generated-count" aria-hidden="true">0</span>
        </label>
      </div>
      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-heading"><span id="load-label">正在读取索引</span><span id="load-count">准备中</span></div>
        <progress id="load-progress" max="100" aria-label="加载进度"></progress>
      </div>
      <div id="notice" class="notice" role="status"></div>
      <div id="empty" class="empty">
        <div class="empty-orbit"><span>＋</span></div>
        <h3>正在加载素材</h3>
        <p>目录就绪后即可浏览。</p>
      </div>
      <div id="grid" class="object-grid"></div>
    </section>
  </main>

  <aside id="detail" class="detail" aria-hidden="true">
    <div class="detail-backdrop" data-close></div>
    <section class="detail-sheet" aria-labelledby="detail-title">
      <button class="close" data-close aria-label="关闭详情">关闭</button>
      <button id="detail-back" class="back" type="button" hidden>返回</button>
      <div id="detail-content"></div>
    </section>
  </aside>

  <dialog id="lightbox" class="lightbox">
    <button id="lightbox-close" class="close">关闭</button>
    <img id="lightbox-image" alt="资源原图">
    <p id="lightbox-caption"></p>
  </dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
